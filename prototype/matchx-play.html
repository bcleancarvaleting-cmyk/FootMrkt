<title>COLLECTR Play</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an app shell — live stats strip, sticky header, one view at a time, fixed bottom dock with a raised centre action. */
:root {
  color-scheme: dark;
  --bg: #07080a; --panel: #0e1014; --raised: #13161b; --sunk: #1a1d24; --line: #272b34; --line2: #383d48;
  --fg: #f3f4f6; --muted: #a0a6b2; --faint: #6b7280;
  --lime: #c8f53c; --lime-ink: #07080a; --gold: #f2cf63; --red: #ff5a5f; --mint: #6ee7a0; --warn: #f5c451;
  --glow-a: rgb(200 245 60 / .10); --glow-b: rgb(242 207 99 / .07); --dock: rgb(14 16 20 / .88); --hl: rgb(255 255 255 / .05);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #f3f4f1; --panel: #ffffff; --raised: #f7f8f5; --sunk: #eceee9; --line: #dadcd5; --line2: #c2c7bd;
  --fg: #101310; --muted: #545b54; --faint: #80877f; --lime: #4f7d00; --lime-ink: #ffffff; --gold: #9a6e00; --red: #d92d2d; --mint: #15803d; --warn: #a35c00;
  --glow-a: rgb(120 170 0 / .08); --glow-b: rgb(200 150 20 / .08); --dock: rgb(255 255 255 / .92); --hl: rgb(255 255 255 / .7);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f1; --panel: #ffffff; --raised: #f7f8f5; --sunk: #eceee9; --line: #dadcd5; --line2: #c2c7bd;
  --fg: #101310; --muted: #545b54; --faint: #80877f; --lime: #4f7d00; --lime-ink: #ffffff; --gold: #9a6e00; --red: #d92d2d; --mint: #15803d; --warn: #a35c00;
  --glow-a: rgb(120 170 0 / .08); --glow-b: rgb(200 150 20 / .08); --dock: rgb(255 255 255 / .92); --hl: rgb(255 255 255 / .7);
}
* { box-sizing: border-box; }
html, body { height: auto; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  background-image: radial-gradient(900px 420px at 85% -120px, var(--glow-a), transparent 70%), radial-gradient(700px 380px at -10% 10%, var(--glow-b), transparent 70%); background-attachment: fixed; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; margin: 0; text-wrap: balance; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .lime { color: var(--lime); } .gold { color: var(--gold); } .red { color: var(--red); } .mint { color: var(--mint); }
.eyebrow { font: 800 11px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.tag { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; font: 800 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; }
.panel { background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 24px; box-shadow: inset 0 1px 0 var(--hl), 0 12px 32px -18px rgb(0 0 0 / .5); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; border: 1px solid transparent; cursor: pointer;
  font: 800 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; transition: transform .15s, background .15s; }
.btn:active { transform: scale(.97); } .btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--lime); color: var(--lime-ink); box-shadow: 0 8px 24px -10px var(--lime); }
.btn-gold { color: #1a1203; background: linear-gradient(135deg, #b8862b, #f9e08b 40%, #d9a93f 60%, #fff0b3); box-shadow: 0 8px 26px -10px rgb(242 207 99 / .8); }
.btn-ghost { background: transparent; border-color: var(--line2); }
.btn-ghost:hover { border-color: var(--lime); color: var(--lime); }
.btn-block { width: 100%; padding: 16px 20px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; background: transparent; cursor: pointer; font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 8px 24px -10px var(--red); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.scroll-x { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; justify-items: center; }
@media (min-width: 640px) { .grid-cards { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); } }
.stack { display: grid; gap: 20px; }
.h-xl { font-size: clamp(54px, 13vw, 96px); } .h-l { font-size: clamp(38px, 8vw, 56px); } .h-m { font-size: 30px; }
.tabular { font-variant-numeric: tabular-nums; }

/* Ticker */
.ticker { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 95%, transparent); font-size: 12px; }
.ticker .wrap { display: flex; overflow-x: auto; scrollbar-width: none; padding-left: 0; padding-right: 0; }
.cell { display: flex; align-items: baseline; gap: 8px; padding: 10px 16px; border-right: 1px solid var(--line); flex-shrink: 0; }
.cell b { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; }
.cell span { font: 700 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.live { color: var(--lime); font: 800 12px/1 var(--body); letter-spacing: .18em; align-items: center; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
.logo { font: italic 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; cursor: pointer; background: none; border: 0; padding: 0; }
.logo em { color: var(--lime); font-style: inherit; }
.spacer { flex: 1; }
.toggle { position: relative; width: 68px; height: 36px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised); cursor: pointer; padding: 0; }
.toggle .knob { position: absolute; top: 3px; left: 34px; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); transition: left .2s; }
:root[data-theme="light"] .toggle .knob { left: 3px; }
.toggle svg { position: absolute; top: 10px; width: 14px; height: 14px; z-index: 1; }
.toggle .sun { left: 10px; } .toggle .moon { right: 10px; }
.credit { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold); border-radius: 999px; padding: 8px 12px; font: 800 12px/1 var(--body); cursor: pointer; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 800 16px/1 var(--display); border: 2px solid #fff; cursor: pointer; }

main { padding-top: 22px; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--dock); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dock ul { list-style: none; margin: 0 auto; padding: 6px 8px 8px; max-width: 560px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.dock button { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px/1 var(--body); color: var(--muted); padding: 6px 0; position: relative; width: 100%; }
.dock .ic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--raised); display: grid; place-items: center; }
.dock .ic svg { width: 20px; height: 20px; }
.dock button[aria-current="page"] { color: var(--fg); }
.dock button[aria-current="page"] .ic { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); box-shadow: 0 0 18px -4px var(--gold); }
.dock button[aria-current="page"]::after { content: ""; position: absolute; bottom: -2px; width: 24px; height: 2px; border-radius: 2px; background: var(--gold); }
.dock .centre { margin-top: -26px; border: 1px solid var(--line2); background: var(--raised); border-radius: 26px; padding: 10px 8px 8px; width: 86px; color: var(--fg); font-weight: 700; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .6); }
.dock .centre .ic { width: 46px; height: 46px; border-radius: 16px; background: var(--lime); color: var(--lime-ink); border: 0; box-shadow: 0 6px 20px -6px var(--lime); }
.dock .centre[aria-current="page"] { border-color: var(--lime); }
.dock .centre[aria-current="page"]::after { display: none; }
.badge { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font: 700 10px/20px var(--body); text-align: center; padding: 0 5px; }

/* Cards — always dark faced */
.card { --c-fg: #f3f4f6; --c-muted: #a0a6b2; --c-faint: #6b7280; position: relative; width: 168px; aspect-ratio: 5 / 7; border-radius: 18px; padding: 3px; overflow: hidden; color: var(--c-fg);
  cursor: pointer; flex-shrink: 0; border: 0; text-align: center; font: inherit; box-shadow: 0 10px 30px -16px rgb(0 0 0 / .8); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.card.sm { width: 128px; } .card.lg { width: 240px; }
.card:hover { transform: translateY(-4px) rotate(-.4deg); }
.foil-G { background: linear-gradient(135deg,#7d5a0e 0%,#f9e08b 22%,#b8862b 40%,#fff2b0 52%,#a3741c 70%,#f0c75e 88%,#8a6a1c 100%); box-shadow: 0 10px 40px -12px rgb(242 207 99 / .7); }
.foil-S { background: linear-gradient(135deg,#6b737e 0%,#f4f6f8 22%,#9aa3ad 40%,#ffffff 52%,#7d8690 70%,#dfe4e9 88%,#6b737e 100%); }
.foil-B { background: linear-gradient(135deg,#5a2f14 0%,#e2a273 22%,#8a4f2a 40%,#f3c39a 52%,#7a4321 70%,#cd8a57 88%,#5a2f14 100%); }
.face { position: relative; height: 100%; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; }
.face-G { background: radial-gradient(120% 80% at 50% 0%, rgb(242 207 99 / .35), transparent 60%), linear-gradient(180deg,#2a1f07,#0d0a03 70%); }
.face-S { background: radial-gradient(120% 80% at 50% 0%, rgb(214 220 227 / .28), transparent 60%), linear-gradient(180deg,#1d2229,#090b0e 70%); }
.face-B { background: radial-gradient(120% 80% at 50% 0%, rgb(205 138 87 / .30), transparent 60%), linear-gradient(180deg,#24150c,#0b0705 70%); }
.sheen { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / .3) 47%, rgb(255 255 255 / .05) 55%, transparent 62%); background-size: 250% 100%; background-position: 120% 0; mix-blend-mode: soft-light; }
.holo { position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: color-dodge; background: conic-gradient(from 210deg at 70% 30%, rgb(255 120 200 / .18), rgb(120 220 255 / .18), rgb(200 255 120 / .18), rgb(255 230 120 / .2), rgb(255 120 200 / .18)); }
@media (prefers-reduced-motion: no-preference) { .card:hover .sheen, .card.foil-G .sheen { animation: sheen 3.6s ease-in-out infinite; } }
@keyframes sheen { 0% { background-position: 120% 0; } 55%, 100% { background-position: -40% 0; } }
.c-top { display: flex; align-items: center; justify-content: space-between; padding: 9px 9px 0; }
.c-pos { background: rgb(7 8 10 / .75); border-radius: 6px; padding: 2px 6px; font: 800 11px/1.3 var(--body); letter-spacing: .06em; }
.c-tier { font: 800 9px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
.foil-G .c-pos, .foil-G .c-tier { color: #fff3c4; } .foil-S .c-pos, .foil-S .c-tier { color: #fff; } .foil-B .c-pos, .foil-B .c-tier { color: #f3d2b8; }
.c-img { position: relative; margin: 6px 9px 0; flex: 1; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(180deg, rgb(255 255 255 / .06), transparent); }
.c-img svg.kit { height: 88%; width: auto; max-width: 100%; }
.c-acq { position: absolute; top: 4px; right: 4px; background: rgb(7 8 10 / .85); border-radius: 4px; padding: 1px 6px; font: 600 9px/1.5 var(--body); color: var(--c-muted); }
.c-name { padding: 6px 8px 0; font: 700 17px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.sm .c-name { font-size: 14px; }
.c-club { font-size: 10px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.c-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 9px 8px; padding-top: 6px; border-top: 1px solid rgb(255 255 255 / .1); text-align: left; }
.c-mp { font: 700 11px/1.2 var(--body); color: #c8f53c; white-space: nowrap; }
.c-sub { font-size: 9px; color: var(--c-faint); white-space: nowrap; }
.c-pts { text-align: right; font: 800 11px/1.2 var(--body); }
.up { color: #6ee7a0; } .down { color: #ff5a5f; }
.badge-crest { width: 20px; height: 23px; }

/* Pitch */
.pitch { position: relative; border-radius: 24px; border: 1px solid var(--line); padding: 18px 10px; background: linear-gradient(180deg, #14301d, #0d2014); overflow: hidden; }
.pitch::before { content: ""; position: absolute; inset: 14px; border: 1px solid rgb(255 255 255 / .12); border-radius: 14px; pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 1px solid rgb(255 255 255 / .12); pointer-events: none; }
.prow { position: relative; display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
.slot { width: 82px; height: 88px; border-radius: 14px; border: 1px dashed rgb(255 255 255 / .3); background: rgb(7 8 10 / .35); color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font: 600 11px/1.1 var(--body); padding: 4px; }
.slot.filled { border-style: solid; border-color: rgb(255 255 255 / .2); background: rgb(7 8 10 / .72); }
.slot.on { border-color: #c8f53c; box-shadow: 0 0 0 2px rgb(200 245 60 / .4); }
.slot b { font: 700 14px/1 var(--display); text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .p { font: 800 10px/1 var(--body); letter-spacing: .08em; color: #c8f53c; }
.bench { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bench .slot { width: 100%; background: var(--sunk); color: var(--fg); border-color: var(--line2); }
.bench .slot.filled { background: var(--raised); }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; background: none; border: 0; padding: 10px 12px; cursor: pointer; text-align: left; }
.pick:hover { background: var(--sunk); }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-G { background: #f2cf63; } .dot-S { background: #d6dce3; } .dot-B { background: #cd8a57; }

/* Sheet / modal */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .6); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 28px; } }
.reveal { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.flip { animation: flip .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes flip { from { transform: perspective(800px) rotateY(90deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flip, .live i, .card .sheen { animation: none !important; } }
.packart { position: relative; overflow: hidden; height: 170px; border-radius: 20px; padding: 16px; display: flex; align-items: flex-end; }
.packart b { position: relative; font: italic 800 52px/1 var(--display); text-transform: uppercase; color: rgb(0 0 0 / .72); }
.packart span.brand { position: absolute; top: 12px; right: 16px; font: italic 800 14px/1 var(--display); text-transform: uppercase; color: rgb(0 0 0 / .55); }
.bubble { display: inline-block; max-width: 80%; border-radius: 18px; padding: 8px 14px; background: var(--sunk); white-space: pre-wrap; word-break: break-word; text-align: left; }
.mine .bubble { background: var(--lime); color: var(--lime-ink); }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.mine { flex-direction: row-reverse; text-align: right; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 14px/1 var(--display); flex-shrink: 0; }
.input { width: 100%; border: 1px solid var(--line2); background: var(--raised); color: var(--fg); border-radius: 16px; padding: 12px 14px; font: inherit; }
.input:focus { outline: none; border-color: var(--lime); }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 13px; box-shadow: 0 10px 30px -10px rgb(0 0 0 / .6); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { padding: 14px 16px; }
.kpi b { display: block; font: 800 30px/1 var(--display); }
.kpi span { font: 700 10px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.res { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; }
.res.on { background: var(--raised); border: 1px solid var(--line); }
.res.off { opacity: .6; }
.note { font-size: 12px; color: var(--faint); }
</style>

<div class="ticker" aria-label="Live stats"><div class="wrap" id="ticker"></div></div>
<header class="top"><div class="wrap">
  <button class="logo" data-go="home" aria-label="COLLECTR home">Collect<em>r</em></button>
  <span class="spacer"></span>
  <button class="toggle" id="theme" role="switch" aria-label="Light or dark mode">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="knob"></span>
    <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></svg>
  </button>
  <button class="credit" data-go="me" id="credit" title="MP credit — spend it on packs"></button>
  <button class="avatar" data-go="me" aria-label="Your profile">Y</button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="dock" aria-label="Main"><ul id="dock"></ul></nav>

function serial(pl) { S.serials[pl.i] = (S.serials[pl.i] || 0) + 1; return S.serials[pl.i]; }
function draw(tier, pos, used, topFlight) {
  let pool = PLAYERS.filter((p) => p.tier === tier && !used.has(p.i) && (!pos || p.pos === pos) && (!topFlight || club(p.club)[4] === 1));
  if (!pool.length) pool = PLAYERS.filter((p) => p.tier === tier && (!pos || p.pos === pos));
  const pl = pick(pool); used.add(pl.i); return pl;
}
function roll(base, ups) { let r = Math.random(), acc = 0; for (const [t, c] of ups) { acc += c; if (r < acc) return t; } return base; }
function openPack(sku) {
  const used = new Set(); const out = [];
  if (sku === "weekly") {
    ["DEF", "MID", "ATT", null, null, null].forEach((pos, i) => out.push(draw(i === 5 ? roll("B", [["S", 0.25]]) : "B", pos, used)));
  } else if (sku === "starter") {
    ["GK", "DEF", "DEF", "MID", "MID", "ATT", "ATT", "DEF", "MID", "ATT", "GK"].forEach((pos, i) => {
      const t = i === 10 ? "B" : roll("B", [["S", 0.3]]);
      out.push(draw(t, pos, used, i === 5 && t === "B"));
    });
  } else if (sku === "bronze") { for (let i = 0; i < 6; i++) out.push(draw(i === 5 ? roll("B", [["S", 0.25]]) : "B", null, used)); }
  else if (sku === "silver") { for (let i = 0; i < 6; i++) out.push(draw(i === 5 ? roll("S", [["G", 0.2]]) : "S", null, used)); }
  else { out.push(draw("G", null, used, true), draw("G", null, used, true));
    for (let i = 0; i < 2; i++) out.push(draw(roll("B", [["G", 0.15], ["S", 0.4]]), null, used));
    for (let i = 0; i < 2; i++) out.push(draw(roll("B", [["S", 0.4]]), null, used)); }
  const cards = out.map((pl) => ({ id: S.nextId++, p: pl.i, serial: serial(pl), acq: sku === "starter" ? "Starter" : sku === "weekly" ? "Weekly" : "Packed", starter: sku === "starter" || sku === "weekly", pts: 0 }));
  S.cards.push(...cards); S.opened++; save();
  return cards;
}
function showReveal(cards, sku) {

  const golds = cards.filter((c) => P(c).tier === "G").length, silvers = cards.filter((c) => P(c).tier === "S").length;
  sheet(`<div class="stack" style="text-align:center"><p class="eyebrow">${esc(PACKS[sku].name)}</p>
    <h2 class="h-l">${golds ? golds + " Gold!" : silvers ? silvers + " Silver" : "New cards"}</h2>
    <div class="reveal" id="rev"></div>
    <div class="row" style="justify-content:center"><button class="btn btn-ghost" id="revall">Reveal all</button>
    <button class="btn btn-primary" data-close>${sku === "starter" ? "Pick my squad" : "Add to my club"}</button></div></div>`, (el) => {
    const rev = el.querySelector("#rev"); let i = 0, timer;
    const next = () => { if (i >= order.length) return; rev.insertAdjacentHTML("beforeend", cardHTML(order[i], "sm", 'style="animation-delay:0s" ').replace('class="card', 'class="flip card')); i++; timer = setTimeout(next, P(order[i - 1]).tier === "G" ? 900 : 380); };
    next();
    el.querySelector("#revall").onclick = () => { clearTimeout(timer); while (i < order.length) { rev.insertAdjacentHTML("beforeend", cardHTML(order[i], "sm").replace('class="card', 'class="flip card')); i++; } };
    el.querySelector("[data-close]").addEventListener("click", () => go(sku === "starter" ? "games" : "club"));

// ───────── squad & simulation ─────────
function slotsFor(f) { const [d, m, a] = FORMATIONS[f]; return [["GK", 1], ["DEF", d], ["MID", m], ["ATT", a]].flatMap(([p, n]) => Array.from({ length: n }, (_, k) => p + "-" + k)); }
function used() { return new Set([...Object.values(S.squad.slots), ...S.squad.bench].filter(Boolean)); }
function autofill() {
  const taken = used(); const players = new Set([...taken].map((id) => S.cards.find((c) => c.id === id)?.p));
  const score = (c) => value(P(c)) + c.pts / 5;
  const pool = [...S.cards].sort((a, b) => score(b) - score(a));
  for (const k of slotsFor(S.squad.formation)) {
    if (S.squad.slots[k]) continue; const pos = k.split("-")[0];
    const c = pool.find((c) => P(c).pos === pos && !taken.has(c.id) && !players.has(c.p));
    if (c) { S.squad.slots[k] = c.id; taken.add(c.id); players.add(c.p); }
  }
  for (let b = 0; b < 4; b++) {
    if (S.squad.bench[b]) continue;
    const hasGk = S.squad.bench.some((id) => id && P(S.cards.find((c) => c.id === id)).pos === "GK");
    const c = (!hasGk && pool.find((c) => P(c).pos === "GK" && !taken.has(c.id) && !players.has(c.p))) || pool.find((c) => !taken.has(c.id) && !players.has(c.p));
    if (c) { S.squad.bench[b] = c.id; taken.add(c.id); players.add(c.p); }
  }
  save();
}
function simLine(pl) {
  const reg = pl.num >= 1 && pl.num <= 11 ? 0.85 : pl.num <= 25 ? 0.6 : 0.35;
  if (Math.random() > reg) return null;
  const mins = Math.random() < 0.75 ? 90 : 20 + rnd(60);
  const w = { GK: [0.01, 0.03], DEF: [0.06, 0.08], MID: [0.16, 0.2], ATT: [0.38, 0.15] }[pl.pos];
  const goals = Math.random() < w[0] ? (Math.random() < 0.15 ? 2 : 1) : 0;
  const assists = Math.random() < w[1] ? 1 : 0;
  const conceded = rnd(4) === 0 ? 0 : rnd(3) + (Math.random() < 0.3 ? 1 : 0);
  return { mins, goals, assists, conceded, saves: pl.pos === "GK" ? rnd(7) : 0, psave: pl.pos === "GK" && Math.random() < 0.05 ? 1 : 0,
    tackles: { GK: 0, DEF: rnd(5), MID: rnd(4), ATT: rnd(2) }[pl.pos], yellow: Math.random() < 0.09 ? 1 : 0, red: Math.random() < 0.007 ? 1 : 0 };
}
function points(pos, s) {
  if (!s) return { pts: 0, items: [] }; const it = [];
  const add = (e, n, each) => { if (n > 0) it.push([e, n * each]); };
  add("Appearance", 1, SCORING.app); if (s.mins >= 60) add("60+ minutes", 1, SCORING.sixty);
  add(s.goals > 1 ? `Goals ×${s.goals}` : "Goal", s.goals, SCORING.goal); add("Assist", s.assists, SCORING.assist);
  if ((pos === "GK" || pos === "DEF") && s.mins >= 60 && s.conceded === 0) add("Clean sheet", 1, SCORING.cs);
  add("Penalty save", s.psave, SCORING.psave); add("Saves", Math.floor(s.saves / 3), SCORING.saves3); add("Tackles", Math.floor(s.tackles / 3), SCORING.tackles3);
  add("Yellow card", s.yellow, SCORING.yellow); add("Red card", s.red, SCORING.red);
  if (pos === "GK" || pos === "DEF") add("Goals conceded", Math.floor(s.conceded / 2), SCORING.conceded2);
  return { pts: it.reduce((a, [, p]) => a + p, 0), items: it };
}
function validShape(counts) { return Object.values(FORMATIONS).some(([d, m, a]) => counts.GK === 1 && counts.DEF === d && counts.MID === m && counts.ATT === a); }
function playGameweek() {
  const keys = slotsFor(S.squad.formation);
  const starters = keys.map((k) => S.cards.find((c) => c.id === S.squad.slots[k]));
  const bench = S.squad.bench.map((id) => S.cards.find((c) => c.id === id));
  const lines = new Map(); [...starters, ...bench].forEach((c) => lines.set(c.id, simLine(P(c))));
  const active = [...starters]; const subs = []; const usedB = new Set();
  for (const st of [...starters].sort((a, b) => (P(a).pos === "GK" ? -1 : 0) - (P(b).pos === "GK" ? -1 : 0))) {
    if (lines.get(st.id)) continue;
    for (const b of bench) {
      if (usedB.has(b.id) || !lines.get(b.id)) continue;
      const sp = P(st).pos, bp = P(b).pos;
      if ((sp === "GK" || bp === "GK") && sp !== bp) continue;
      const counts = { GK: 0, DEF: 0, MID: 0, ATT: 0 }; active.filter((c) => c.id !== st.id).forEach((c) => counts[P(c).pos]++); counts[bp]++;
      if (!validShape(counts)) continue;
      active.splice(active.indexOf(st), 1, b); usedB.add(b.id); subs.push([st.id, b.id]); break;
    }
  }
  const rows = [...starters, ...bench].map((c) => { const r = points(P(c).pos, lines.get(c.id)); return { id: c.id, counted: active.includes(c), played: !!lines.get(c.id), ...r }; });
  const total = rows.filter((r) => r.counted).reduce((a, r) => a + r.pts, 0);
  rows.filter((r) => r.counted).forEach((r) => (S.cards.find((c) => c.id === r.id).pts += r.pts));
  // Values move with form.
  const touched = new Set(rows.map((r) => S.cards.find((c) => c.id === r.id).p));
  PLAYERS.forEach((pl) => { const v = value(pl); const r = rows.find((x) => S.cards.find((c) => c.id === x.id).p === pl.i);
    const delta = touched.has(pl.i) && r ? (r.pts >= 12 ? 2 : r.pts >= 6 ? 1 : r.pts === 0 ? -1 : 0) : pick([-1, 0, 0, 0, 1]);
    pl.hist.push(Math.max(1, v + (pl.tier === "G" ? delta : Math.sign(delta) * (Math.random() < 0.5 ? 1 : 0)))); if (pl.hist.length > 8) pl.hist.shift(); });
  const field = RIVALS.map((n) => [n, 8 + rnd(42)]).concat([["You", total]]).sort((a, b) => b[1] - a[1]);
  const rank = field.findIndex((f) => f[0] === "You") + 1;
  let reward = null;
  if (rank === 1) reward = "gold"; else if (rank <= 3) reward = "silver"; else reward = "bronze";
  S.packs.push({ sku: reward, id: S.nextPack++ });
  S.gw.last = { n: S.gw.n, total, rank, field, rows, subs, formation: S.squad.formation, reward };
  S.history.push({ n: S.gw.n, total, rank });
  S.gw.n++; S.gw.deadline = Date.now() + (2 * 86400 + 4 * 3600) * 1000;
  save();
}

  const n = (t) => S.cards.filter((c) => P(c).tier === t).length;
  return `<div class="stack">${tabs}<div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">My Club</p><h1 class="h-l">My Cards</h1></div>
    <div class="row"><span class="tag">${S.cards.length} cards</span><span class="tag gold">${n("G")} Gold</span><span class="tag">${n("S")} Silver</span><span class="tag" style="color:#cd8a57">${n("B")} Bronze</span></div></div>
    <div class="scroll-x">${[["", "All"], ["G", "Gold"], ["S", "Silver"], ["B", "Bronze"]].map(([k, l]) => `<button class="chip" data-tier="${k}" aria-pressed="${tierF === k}">${l}</button>`).join("")}
      <span style="width:8px"></span>${[["", "All positions"], ["GK", "GK"], ["DEF", "DEF"], ["MID", "MID"], ["ATT", "ATT"]].map(([k, l]) => `<button class="chip" data-pos="${k}" aria-pressed="${posF === k}">${l}</button>`).join("")}</div>
    ${list.length ? `<div class="grid-cards">${list.map((c) => cardHTML(c)).join("")}</div>` : `<div class="panel" style="padding:28px;text-align:center" class="muted">No cards yet. <button class="btn btn-gold" data-go="packs" style="margin-left:8px">Open packs</button></div>`}</div>`;
}
function cardSheet(id) {
  const c = S.cards.find((x) => x.id === id); const pl = P(c); const h = pl.hist; const v = value(pl), t = trend(pl);
  const min = Math.min(...h) - 1, max = Math.max(...h) + 1, W = 300, H = 110;
  const pts = h.map((y, i) => [12 + (i / (h.length - 1)) * (W - 24), H - 14 - ((y - min) / (max - min)) * (H - 28)]);
  const col = h[h.length - 1] >= h[0] ? "#6ee7a0" : "#ff5a5f";
  sheet(`<div class="stack" style="gap:16px"><div class="row" style="justify-content:space-between"><p class="eyebrow">${TIER[pl.tier]} · ${pl.pos} · #${c.serial}</p><button class="btn btn-ghost" data-close style="padding:8px 14px">Close</button></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">${cardHTML(c, "lg", "tabindex='-1'")}
    <div class="stack" style="flex:1;min-width:220px;gap:12px"><h2 class="h-l">${esc(pl.name)}</h2><p class="muted">${esc(club(pl.club)[0])} · ${esc(club(pl.club)[3])}</p>
      <div class="kpis"><div class="panel kpi"><b class="lime">${v} MP</b><span>≈ £${v} indicative</span></div><div class="panel kpi"><b>${fmt(c.pts)}</b><span>pts won for you</span></div><div class="panel kpi"><b>${c.starter ? "Starter" : esc(c.acq)}</b><span>you got it</span></div></div>
      <div class="panel" style="padding:14px"><div class="row" style="justify-content:space-between"><b style="font:800 20px/1 var(--display);text-transform:uppercase">Value history</b><b class="${t >= 0 ? "mint" : "red"}">${t >= 0 ? "▲" : "▼"} ${Math.abs(t)}%</b></div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="MP value over the last ${h.length} gameweeks"><path d="M${pts.map((p) => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${H} L${pts[0][0]},${H} Z" fill="${col}" opacity=".14"/><path d="M${pts.map((p) => p.join(",")).join(" L")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="${col}"/>`).join("")}</svg>
        <p class="note">MP is an indicative value, not cash.</p></div></div></div></div>`);
}
function vGames() {
  if (!S.cards.length) return `<div class="panel" style="padding:28px;text-align:center"><h1 class="h-l">Open your Starter Pack first</h1><p class="muted" style="margin:10px 0 18px">You need players before you can pick a squad.</p><button class="btn btn-gold" data-go="packs">Go to packs</button></div>`;
  const last = S.gw.last;
  const keys = slotsFor(S.squad.formation); const byId = (id) => S.cards.find((c) => c.id === id);
  const rows = ["ATT", "MID", "DEF", "GK"].map((pos) => `<div class="prow">${keys.filter((k) => k.startsWith(pos)).map((k) => { const c = byId(S.squad.slots[k]);
    return `<button class="slot ${c ? "filled" : ""} ${selSlot === k ? "on" : ""}" data-slot="${k}">${c ? `<span class="p">${pos}</span><b>${esc(P(c).name.split(" ").slice(-1)[0])}</b><span style="opacity:.7">${value(P(c))} MP</span>` : `<span class="p">+ ${pos}</span>`}</button>`; }).join("")}</div>`).join("");
  const bench = [0, 1, 2, 3].map((i) => { const c = byId(S.squad.bench[i]); return `<button class="slot ${c ? "filled" : ""} ${selSlot === "B-" + i ? "on" : ""}" data-slot="B-${i}"><span class="p" style="color:var(--gold)">Sub ${i + 1}</span>${c ? `<b>${esc(P(c).name.split(" ").slice(-1)[0])}</b><span class="faint">${P(c).pos}</span>` : "<span class='faint'>+ add</span>"}</button>`; }).join("");
  const full = keys.every((k) => S.squad.slots[k]) && [0, 1, 2, 3].every((i) => S.squad.bench[i]);
  return `<div class="stack">
    <div><p class="eyebrow">Open League · GW${S.gw.n}</p><h1 class="h-l">Pick your squad</h1><p class="muted">Squads lock in <b>${countdown()}</b> — 10 minutes before the first kick-off.</p></div>
    <div class="scroll-x">${Object.keys(FORMATIONS).map((f) => `<button class="chip" data-form="${f}" aria-pressed="${S.squad.formation === f}">1-${f}</button>`).join("")}
      <button class="chip" data-auto>Auto-fill</button><button class="chip" data-clear>Clear</button></div>
    <div class="pitch">${rows}</div>
    <div class="panel" style="padding:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="eyebrow" style="color:var(--muted)">Bench · subs come on in this order</span></div><div class="bench">${bench}</div></div>
    <button class="btn btn-primary btn-block" data-play ${full ? "" : "disabled"}>Lock squad &amp; play gameweek ${S.gw.n}</button>
    <p class="note">Prototype: the gameweek is simulated instantly so you can see scoring, auto-subs and rewards.</p>
    ${last ? resultsHTML(last) : ""}</div>`;
}
function resultsHTML(r) {
  const byId = (id) => S.cards.find((c) => c.id === id);
  return `<section class="stack" style="gap:12px"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">Gameweek ${r.n} · final</p><h2 class="h-l">${r.total} pts · #${r.rank}</h2></div><span class="tag">Won: ${esc(PACKS[r.reward].name)}</span></div>
    <div class="panel" style="padding:8px">${r.rows.filter((x) => byId(x.id)).map((x) => { const c = byId(x.id); const sub = r.subs.find((s) => s[1] === x.id), off = r.subs.find((s) => s[0] === x.id);
      return `<div class="res ${x.counted ? "on" : "off"}"><span class="dot dot-${P(c).tier}"></span><b style="flex:1;font-weight:600">${esc(P(c).name)} <span class="faint" style="font-size:12px">${P(c).pos}</span>
      ${off ? '<span class="red" style="font-size:11px"> ↓ didn\'t play</span>' : ""}${sub ? '<span class="mint" style="font-size:11px"> ↑ auto-sub on</span>' : ""}${!x.played && !off && x.counted ? '<span class="red" style="font-size:11px"> didn\'t play</span>' : ""}</b>
      <span class="faint" style="font-size:11px;max-width:40%;text-align:right">${x.items.map(([e, p]) => `${e} ${p > 0 ? "+" : ""}${p}`).join(" · ")}</span><b class="${x.counted ? "lime" : "faint"}" style="width:32px;text-align:right">${x.pts}</b></div>`; }).join("")}</div>
    <div class="panel" style="padding:8px">${r.field.map((f, i) => `<div class="res ${f[0] === "You" ? "on" : ""}"><span class="faint" style="width:28px">#${i + 1}</span><b style="flex:1">${esc(f[0])}</b><b>${f[1]} pts</b></div>`).join("")}</div></section>`;
}
function pickerSheet(k) {
  const pos = k.startsWith("B-") ? null : k.split("-")[0]; const taken = used(); const current = k.startsWith("B-") ? S.squad.bench[+k.slice(2)] : S.squad.slots[k];
  const players = new Set([...taken].filter((id) => id !== current).map((id) => S.cards.find((c) => c.id === id)?.p));
  const list = S.cards.filter((c) => !pos || P(c).pos === pos).sort((a, b) => value(P(b)) - value(P(a)));
  sheet(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="h-m">${pos ? "Choose a " + pos : "Choose Sub " + (+k.slice(2) + 1)}</h2><button class="btn btn-ghost" data-close style="padding:8px 14px">Close</button></div>
    <ul class="list panel">${list.map((c) => { const pl = P(c); const dis = (taken.has(c.id) && c.id !== current) || players.has(c.p);
      return `<li><button class="pick" data-choose="${c.id}" data-for="${k}" ${dis ? "disabled" : ""}><span class="dot dot-${pl.tier}"></span>${crest(pl.club, 18)}<span style="flex:1;min-width:0"><b>${esc(pl.name)}</b><br><span class="faint" style="font-size:12px">${pl.pos} · ${esc(club(pl.club)[0])}${dis ? " · picked" : ""}</span></span><span style="text-align:right"><b class="lime">${value(pl)} MP</b><br><span class="faint" style="font-size:12px">${c.pts} pts for you</span></span></button></li>`; }).join("") || '<li style="padding:16px" class="muted">No players for this position yet — open more packs.</li>'}</ul>
    ${current ? `<button class="btn btn-ghost btn-block" style="margin-top:12px" data-remove="${k}">Remove from slot</button>` : ""}`);
}
function vChat() {
  const msgs = S.chat[room] || [];
  const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
  return `<div class="stack" style="gap:14px"><div><p class="eyebrow">Community</p><h1 class="h-l">Manager chat</h1></div>
    <div class="scroll-x">${ROOMS.map(([k, l]) => `<button class="chip" data-room="${k}" aria-pressed="${room === k}">${l}${(S.chat[k] || []).length ? ` · ${(S.chat[k] || []).length}` : ""}</button>`).join("")}</div>
    <div class="panel" style="display:flex;flex-direction:column;height:calc(100dvh - 420px);min-height:320px;overflow:hidden">
      <div id="msgs" style="flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start">${msgs.length ? msgs.map((m) => { const mine = m.who === "You";
        return `<div class="msg ${mine ? "mine" : ""}"><span class="av" style="background:${mine ? "var(--red)" : `hsl(${hue(m.who)} 55% 38%)`}">${esc(m.who[0])}</span><div style="min-width:0"><div style="font-size:12px"><b>${esc(m.who)}</b> <span class="faint">${new Date(m.t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span></div><div class="bubble">${esc(m.body)}</div></div></div>`; }).join("") : '<p class="faint" style="text-align:center;padding:30px 0">No messages yet — say hello.</p>'}</div>
      <form id="chatform" style="border-top:1px solid var(--line);padding:10px;display:flex;gap:8px"><label for="chatinput" style="position:absolute;left:-9999px">Message</label><input id="chatinput" class="input" maxlength="400" placeholder="Message the managers…" autocomplete="off"><button class="btn btn-primary">Send</button></form>
    </div><p class="note">Be kind. No links. Messages can be reported and removed by moderators. (Prototype: other managers here are bots.)</p></div>`;
}
function vMe() {
  const total = S.cards.reduce((a, c) => a + c.pts, 0);
  return `<div class="stack"><div><p class="eyebrow">Manager profile</p><h1 class="h-l">You</h1></div>
    <div class="kpis"><div class="panel kpi"><b class="gold">${mp(S.credit)}</b><span>MP credit</span></div><div class="panel kpi"><b>${S.cards.length}</b><span>cards</span></div><div class="panel kpi"><b class="lime">${fmt(total)}</b><span>points won</span></div><div class="panel kpi"><b>${S.history.length ? "#" + Math.min(...S.history.map((h) => h.rank)) : "—"}</b><span>best finish</span></div></div>
    <h2 class="h-m">Credit history</h2><div class="panel" style="padding:8px">${[...S.ledger].reverse().map((e) => `<div class="res"><span style="flex:1">${esc(e.d)}</span><b class="${e.a > 0 ? "mint" : "muted"}">${e.a > 0 ? "+" : ""}${mp(e.a)}</b></div>`).join("")}</div>
    <h2 class="h-m">Gameweeks</h2><div class="panel" style="padding:8px">${S.history.length ? [...S.history].reverse().map((h) => `<div class="res"><span style="flex:1">Gameweek ${h.n}</span><b>${h.total} pts · #${h.rank}</b></div>`).join("") : '<p class="muted" style="padding:10px">Play a gameweek from Games.</p>'}</div>
    <div id="reset"><button class="btn btn-ghost" data-reset>Start over</button></div>
    <p class="note">Playable prototype of COLLECTR Football. Real 2026-27 squads (Wikipedia, CC BY-SA); everything else is simulated and saved only in this browser. MP is an indicative valuation, not cash.</p></div>`;
}

// ───────── events ─────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.go) { const [v, tab] = d.go.split(":"); if (tab) clubTab = tab; return go(v); }
  if (d.card) return cardSheet(+d.card);
  if (d.open) { const pk = S.packs.find((x) => x.id === +d.open); S.packs = S.packs.filter((x) => x !== pk); const cards = openPack(pk.sku); render(); return showReveal(cards, pk.sku); }
  if (d.buy) { const p = PACKS[d.buy]; if (S.credit < p.price) return toast("Not enough MP credit"); S.credit -= p.price; S.ledger.push({ t: Date.now(), d: "Bought " + p.name, a: -p.price }); S.packs.unshift({ sku: d.buy, id: S.nextPack++ }); save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return toast(p.name + " added — open it at the top"); }
  if (d.weekly !== undefined) { if (S.weekly === weekKey()) return toast("Already claimed this week"); S.weekly = weekKey(); const cards = openPack("weekly"); render(); return showReveal(cards, "weekly"); }
  if (d.tab) { clubTab = d.tab; return render(); }
  if (d.tier !== undefined) { tierF = d.tier; return render(); }
  if (d.pos !== undefined) { posF = d.pos; return render(); }
  if (d.set) { const set = SETS.find((s) => s.id === d.set); const use = setCards(set).slice(0, set.n); if (use.length < set.n) return;
    const ids = new Set(use.map((c) => c.id)); S.cards = S.cards.filter((c) => !ids.has(c.id)); S.credit += 1000; S.sets.push(set.id); S.ledger.push({ t: Date.now(), d: "Set completed: " + set.name, a: 1000 }); save(); render(); return toast("+10 MP credit — " + set.name + " complete"); }
  if (d.form) { S.squad.formation = d.form; const keys = new Set(slotsFor(d.form)); for (const k of Object.keys(S.squad.slots)) if (!keys.has(k)) delete S.squad.slots[k]; save(); return render(); }
  if (d.auto !== undefined) { autofill(); return render(); }
  if (d.clear !== undefined) { S.squad.slots = {}; S.squad.bench = []; save(); return render(); }
  if (d.slot) { selSlot = d.slot; render(); return pickerSheet(d.slot); }
  if (d.choose) { const k = d.for, id = +d.choose; for (const kk of Object.keys(S.squad.slots)) if (S.squad.slots[kk] === id) delete S.squad.slots[kk]; S.squad.bench = S.squad.bench.map((x) => (x === id ? null : x));
    if (k.startsWith("B-")) S.squad.bench[+k.slice(2)] = id; else S.squad.slots[k] = id; save(); closeSheet(); selSlot = null; return render(); }
  if (d.remove) { const k = d.remove; if (k.startsWith("B-")) S.squad.bench[+k.slice(2)] = null; else delete S.squad.slots[k]; save(); closeSheet(); selSlot = null; return render(); }
  if (d.play !== undefined) { playGameweek(); render(); const el = document.querySelector("section.stack"); if (el) el.scrollIntoView({ behavior: "smooth" }); return toast(`GW${S.gw.last.n}: ${S.gw.last.total} pts, rank #${S.gw.last.rank} — ${PACKS[S.gw.last.reward].name} won`); }
  if (d.room) { room = d.room; return render(); }
  if (d.reset !== undefined) { document.getElementById("reset").innerHTML = `<div class="row"><span class="muted">Delete your cards, credit and history?</span><button class="btn btn-primary" data-reset-yes>Yes, start over</button><button class="btn btn-ghost" data-go="me">Keep playing</button></div>`; return; }
  if (d.resetYes !== undefined) { PLAYERS.forEach((p, i) => (p.hist = DATA.players[i][5].slice())); S = fresh(); save(); toast("Fresh start"); return go("home"); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "chatform") return; e.preventDefault();
  const input = document.getElementById("chatinput"); const body = input.value.trim(); if (!body) return;
  if (/(https?:\/\/|www\.)|\b[a-z0-9-]+\.(com|net|org|io|co|uk|gg|xyz)\b/i.test(body)) return toast("Links aren't allowed in chat");
  S.chat[room].push({ who: "You", body, t: Date.now() }); save(); render(); document.getElementById("chatinput").focus();
  if (Math.random() < 0.8) setTimeout(() => { const replies = ["Love that 🔥", "Bold call. What formation?", "Same here, packs have been kind this week", "Who's on your bench?", "Deadline creeping up — get your squad in!", "Gold pack or save for sets?", "Bench GK is a must"];
    S.chat[room].push({ who: pick(RIVALS), body: pick(replies), t: Date.now() }); save(); if (view === "chat") render(); }, 1500 + rnd(2500));
});
document.getElementById("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next; try { localStorage.setItem(KEY + "-theme", next); } catch (e) {}
});
(function boot() {
  let theme = "dark"; try { theme = localStorage.getItem(KEY + "-theme") || "dark"; } catch (e) {}
  document.documentElement.dataset.theme = theme;
  if (S.hist) PLAYERS.forEach((p) => (p.hist = S.hist[p.i] || p.hist));
  const h = (location.hash || "").slice(1); if (["home", "packs", "club", "games", "chat", "me"].includes(h)) view = h;
  render(); ticker(); setInterval(ticker, 1000);
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== view && ["home", "packs", "club", "games", "chat", "me"].includes(v)) go(v); });
})();
// Persist player values with the save.
const _save = save; save = function () { S.hist = PLAYERS.map((p) => p.hist); _save(); };
</script>
