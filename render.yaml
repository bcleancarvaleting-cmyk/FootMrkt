# MATCHX TEST SITE on Render (free plan). Everything switched on, pretend card payments, simulated
# match data. NOT for real money: no real payment provider is connected.
# Render dashboard → New → Blueprint → pick this repository and branch. You'll be asked for an
# admin password; then wait for the first deploy (about 5–10 minutes).
services:
  - type: web
    name: matchx-test
    runtime: node
    plan: free
    branch: claude/football-manager-game-mode-b8ib5b
    buildCommand: npm ci && npx next build
    # Database tables, then the starter data (leagues, clubs, players, packs — skipped once loaded), then the app.
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: matchx-test-db
          property: connectionString
      - key: SEED_ADMIN_PASSWORD
        sync: false # you choose it when creating the blueprint; log in as admin@matchx.dev
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TEST_SITE
        value: "true"
      - key: RUN_JOBS_IN_APP
        value: "true"
      - key: PAYMENTS_PROVIDER
        value: sandbox
      - key: LEGAL_GATES_CLEARED
        value: PAID_PACKS,MARKET,DEPOSITS,WITHDRAWALS,PAID_ENTRY,AUCTIONS
      - key: FLAG_PACK_SHOP
        value: "true"
      - key: FLAG_PAID_PACKS
        value: "true"
      - key: FLAG_DEPOSITS
        value: "true"
      - key: FLAG_MARKET
        value: "true"
      - key: FLAG_AUCTIONS
        value: "true"
      - key: FLAG_WITHDRAWALS
        value: "true"
      - key: FLAG_DEV_TOOLS
        value: "true"
      - key: FLAG_SIMULATED_DATA
        value: "true"

databases:
  - name: matchx-test-db
    plan: free
    databaseName: matchx
