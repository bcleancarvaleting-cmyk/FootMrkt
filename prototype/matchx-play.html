<title>MATCHX Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an app shell — live stats strip, sticky header, one view at a time, fixed bottom dock with a raised centre action. */
:root {
  color-scheme: dark;
  --bg: #07080a; --panel: #0e1014; --raised: #13161b; --sunk: #1a1d24; --line: #272b34; --line2: #383d48;
  --fg: #f3f4f6; --muted: #a0a6b2; --faint: #6b7280;
  --lime: #c8f53c; --lime-ink: #07080a; --gold: #f2cf63; --red: #ff5a5f; --mint: #6ee7a0; --warn: #f5c451;
  --glow-a: rgb(200 245 60 / .10); --glow-b: rgb(242 207 99 / .07); --dock: rgb(14 16 20 / .88); --hl: rgb(255 255 255 / .05);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #f3f4f1; --panel: #ffffff; --raised: #f7f8f5; --sunk: #eceee9; --line: #dadcd5; --line2: #c2c7bd;
  --fg: #101310; --muted: #545b54; --faint: #80877f; --lime: #4f7d00; --lime-ink: #ffffff; --gold: #9a6e00; --red: #d92d2d; --mint: #15803d; --warn: #a35c00;
  --glow-a: rgb(120 170 0 / .08); --glow-b: rgb(200 150 20 / .08); --dock: rgb(255 255 255 / .92); --hl: rgb(255 255 255 / .7);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f1; --panel: #ffffff; --raised: #f7f8f5; --sunk: #eceee9; --line: #dadcd5; --line2: #c2c7bd;
  --fg: #101310; --muted: #545b54; --faint: #80877f; --lime: #4f7d00; --lime-ink: #ffffff; --gold: #9a6e00; --red: #d92d2d; --mint: #15803d; --warn: #a35c00;
  --glow-a: rgb(120 170 0 / .08); --glow-b: rgb(200 150 20 / .08); --dock: rgb(255 255 255 / .92); --hl: rgb(255 255 255 / .7);
}
* { box-sizing: border-box; }
html, body { height: auto; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  background-image: radial-gradient(900px 420px at 85% -120px, var(--glow-a), transparent 70%), radial-gradient(700px 380px at -10% 10%, var(--glow-b), transparent 70%); background-attachment: fixed; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; margin: 0; text-wrap: balance; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .lime { color: var(--lime); } .gold { color: var(--gold); } .red { color: var(--red); } .mint { color: var(--mint); }
.eyebrow { font: 800 11px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.tag { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; font: 800 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; }
.panel { background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 24px; box-shadow: inset 0 1px 0 var(--hl), 0 12px 32px -18px rgb(0 0 0 / .5); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; border: 1px solid transparent; cursor: pointer;
  font: 800 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; transition: transform .15s, background .15s; }
.btn:active { transform: scale(.97); } .btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--lime); color: var(--lime-ink); box-shadow: 0 8px 24px -10px var(--lime); }
.btn-gold { color: #1a1203; background: linear-gradient(135deg, #b8862b, #f9e08b 40%, #d9a93f 60%, #fff0b3); box-shadow: 0 8px 26px -10px rgb(242 207 99 / .8); }
.btn-ghost { background: transparent; border-color: var(--line2); }
.btn-ghost:hover { border-color: var(--lime); color: var(--lime); }
.btn-block { width: 100%; padding: 16px 20px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; background: transparent; cursor: pointer; font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 8px 24px -10px var(--red); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.scroll-x { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; justify-items: center; }
@media (min-width: 640px) { .grid-cards { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); } }
.stack { display: grid; gap: 20px; }
.h-xl { font-size: clamp(54px, 13vw, 96px); } .h-l { font-size: clamp(38px, 8vw, 56px); } .h-m { font-size: 30px; }
.tabular { font-variant-numeric: tabular-nums; }

/* Ticker */
.ticker { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 95%, transparent); font-size: 12px; }
.ticker .wrap { display: flex; overflow-x: auto; scrollbar-width: none; padding-left: 0; padding-right: 0; }
.cell { display: flex; align-items: baseline; gap: 8px; padding: 10px 16px; border-right: 1px solid var(--line); flex-shrink: 0; }
.cell b { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; }
.cell span { font: 700 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.live { color: var(--lime); font: 800 12px/1 var(--body); letter-spacing: .18em; align-items: center; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
header.top .wrap { display: flex; align-items: center; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
.logo { font: italic 800 28px/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; cursor: pointer; background: none; border: 0; padding: 0; }
.logo em { color: var(--lime); font-style: inherit; }
.spacer { flex: 1; }
.toggle { position: relative; width: 68px; height: 36px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised); cursor: pointer; padding: 0; }
.toggle .knob { position: absolute; top: 3px; left: 34px; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); transition: left .2s; }
:root[data-theme="light"] .toggle .knob { left: 3px; }
.toggle svg { position: absolute; top: 10px; width: 14px; height: 14px; z-index: 1; }
.toggle .sun { left: 10px; } .toggle .moon { right: 10px; }
.credit { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold); border-radius: 999px; padding: 8px 12px; font: 800 12px/1 var(--body); cursor: pointer; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 800 16px/1 var(--display); border: 2px solid #fff; cursor: pointer; }

main { padding-top: 22px; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* Dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--dock); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dock ul { list-style: none; margin: 0 auto; padding: 6px 8px 8px; max-width: 560px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.dock button { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px/1 var(--body); color: var(--muted); padding: 6px 0; position: relative; width: 100%; }
.dock .ic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line2); background: var(--raised); display: grid; place-items: center; }
.dock .ic svg { width: 20px; height: 20px; }
.dock button[aria-current="page"] { color: var(--fg); }
.dock button[aria-current="page"] .ic { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); box-shadow: 0 0 18px -4px var(--gold); }
.dock button[aria-current="page"]::after { content: ""; position: absolute; bottom: -2px; width: 24px; height: 2px; border-radius: 2px; background: var(--gold); }
.dock .centre { margin-top: -26px; border: 1px solid var(--line2); background: var(--raised); border-radius: 26px; padding: 10px 8px 8px; width: 86px; color: var(--fg); font-weight: 700; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .6); }
.dock .centre .ic { width: 46px; height: 46px; border-radius: 16px; background: var(--lime); color: var(--lime-ink); border: 0; box-shadow: 0 6px 20px -6px var(--lime); }
.dock .centre[aria-current="page"] { border-color: var(--lime); }
.dock .centre[aria-current="page"]::after { display: none; }
.badge { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font: 700 10px/20px var(--body); text-align: center; padding: 0 5px; }

/* Cards — always dark faced */
.card { --c-fg: #f3f4f6; --c-muted: #a0a6b2; --c-faint: #6b7280; position: relative; width: 168px; aspect-ratio: 5 / 7; border-radius: 18px; padding: 3px; overflow: hidden; color: var(--c-fg);
  cursor: pointer; flex-shrink: 0; border: 0; text-align: center; font: inherit; box-shadow: 0 10px 30px -16px rgb(0 0 0 / .8); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.card.sm { width: 128px; } .card.lg { width: 240px; }
.card:hover { transform: translateY(-4px) rotate(-.4deg); }
.foil-G { background: linear-gradient(135deg,#7d5a0e 0%,#f9e08b 22%,#b8862b 40%,#fff2b0 52%,#a3741c 70%,#f0c75e 88%,#8a6a1c 100%); box-shadow: 0 10px 40px -12px rgb(242 207 99 / .7); }
.foil-S { background: linear-gradient(135deg,#6b737e 0%,#f4f6f8 22%,#9aa3ad 40%,#ffffff 52%,#7d8690 70%,#dfe4e9 88%,#6b737e 100%); }
.foil-B { background: linear-gradient(135deg,#5a2f14 0%,#e2a273 22%,#8a4f2a 40%,#f3c39a 52%,#7a4321 70%,#cd8a57 88%,#5a2f14 100%); }
.face { position: relative; height: 100%; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; }
.face-G { background: radial-gradient(120% 80% at 50% 0%, rgb(242 207 99 / .35), transparent 60%), linear-gradient(180deg,#2a1f07,#0d0a03 70%); }
.face-S { background: radial-gradient(120% 80% at 50% 0%, rgb(214 220 227 / .28), transparent 60%), linear-gradient(180deg,#1d2229,#090b0e 70%); }
.face-B { background: radial-gradient(120% 80% at 50% 0%, rgb(205 138 87 / .30), transparent 60%), linear-gradient(180deg,#24150c,#0b0705 70%); }
.sheen { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / .3) 47%, rgb(255 255 255 / .05) 55%, transparent 62%); background-size: 250% 100%; background-position: 120% 0; mix-blend-mode: soft-light; }
.holo { position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: color-dodge; background: conic-gradient(from 210deg at 70% 30%, rgb(255 120 200 / .18), rgb(120 220 255 / .18), rgb(200 255 120 / .18), rgb(255 230 120 / .2), rgb(255 120 200 / .18)); }
@media (prefers-reduced-motion: no-preference) { .card:hover .sheen, .card.foil-G .sheen { animation: sheen 3.6s ease-in-out infinite; } }
@keyframes sheen { 0% { background-position: 120% 0; } 55%, 100% { background-position: -40% 0; } }
.c-top { display: flex; align-items: center; justify-content: space-between; padding: 9px 9px 0; }
.c-pos { background: rgb(7 8 10 / .75); border-radius: 6px; padding: 2px 6px; font: 800 11px/1.3 var(--body); letter-spacing: .06em; }
.c-tier { font: 800 9px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
.foil-G .c-pos, .foil-G .c-tier { color: #fff3c4; } .foil-S .c-pos, .foil-S .c-tier { color: #fff; } .foil-B .c-pos, .foil-B .c-tier { color: #f3d2b8; }
.c-img { position: relative; margin: 6px 9px 0; flex: 1; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: linear-gradient(180deg, rgb(255 255 255 / .06), transparent); }
.c-img svg.kit { height: 88%; width: auto; max-width: 100%; }
.c-acq { position: absolute; top: 4px; right: 4px; background: rgb(7 8 10 / .85); border-radius: 4px; padding: 1px 6px; font: 600 9px/1.5 var(--body); color: var(--c-muted); }
.c-name { padding: 6px 8px 0; font: 700 17px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.sm .c-name { font-size: 14px; }
.c-club { font-size: 10px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
.c-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 9px 8px; padding-top: 6px; border-top: 1px solid rgb(255 255 255 / .1); text-align: left; }
.c-mp { font: 700 11px/1.2 var(--body); color: #c8f53c; white-space: nowrap; }
.c-sub { font-size: 9px; color: var(--c-faint); white-space: nowrap; }
.c-pts { text-align: right; font: 800 11px/1.2 var(--body); }
.up { color: #6ee7a0; } .down { color: #ff5a5f; }
.badge-crest { width: 20px; height: 23px; }

/* Pitch */
.pitch { position: relative; border-radius: 24px; border: 1px solid var(--line); padding: 18px 10px; background: linear-gradient(180deg, #14301d, #0d2014); overflow: hidden; }
.pitch::before { content: ""; position: absolute; inset: 14px; border: 1px solid rgb(255 255 255 / .12); border-radius: 14px; pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 1px solid rgb(255 255 255 / .12); pointer-events: none; }
.prow { position: relative; display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
.slot { width: 82px; height: 88px; border-radius: 14px; border: 1px dashed rgb(255 255 255 / .3); background: rgb(7 8 10 / .35); color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font: 600 11px/1.1 var(--body); padding: 4px; }
.slot.filled { border-style: solid; border-color: rgb(255 255 255 / .2); background: rgb(7 8 10 / .72); }
.slot.on { border-color: #c8f53c; box-shadow: 0 0 0 2px rgb(200 245 60 / .4); }
.slot b { font: 700 14px/1 var(--display); text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .p { font: 800 10px/1 var(--body); letter-spacing: .08em; color: #c8f53c; }
.bench { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bench .slot { width: 100%; background: var(--sunk); color: var(--fg); border-color: var(--line2); }
.bench .slot.filled { background: var(--raised); }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.pick { display: flex; gap: 12px; align-items: center; width: 100%; background: none; border: 0; padding: 10px 12px; cursor: pointer; text-align: left; }
.pick:hover { background: var(--sunk); }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-G { background: #f2cf63; } .dot-S { background: #d6dce3; } .dot-B { background: #cd8a57; }

/* Sheet / modal */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .6); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 28px 28px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 28px; } }
.reveal { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.flip { animation: flip .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes flip { from { transform: perspective(800px) rotateY(90deg) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flip, .live i, .card .sheen { animation: none !important; } }
.packart { position: relative; overflow: hidden; height: 170px; border-radius: 20px; padding: 16px; display: flex; align-items: flex-end; }
.packart b { position: relative; font: italic 800 52px/1 var(--display); text-transform: uppercase; color: rgb(0 0 0 / .72); }
.packart span.brand { position: absolute; top: 12px; right: 16px; font: italic 800 14px/1 var(--display); text-transform: uppercase; color: rgb(0 0 0 / .55); }
.bubble { display: inline-block; max-width: 80%; border-radius: 18px; padding: 8px 14px; background: var(--sunk); white-space: pre-wrap; word-break: break-word; text-align: left; }
.mine .bubble { background: var(--lime); color: var(--lime-ink); }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg.mine { flex-direction: row-reverse; text-align: right; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 14px/1 var(--display); flex-shrink: 0; }
.input { width: 100%; border: 1px solid var(--line2); background: var(--raised); color: var(--fg); border-radius: 16px; padding: 12px 14px; font: inherit; }
.input:focus { outline: none; border-color: var(--lime); }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 13px; box-shadow: 0 10px 30px -10px rgb(0 0 0 / .6); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { padding: 14px 16px; }
.kpi b { display: block; font: 800 30px/1 var(--display); }
.kpi span { font: 700 10px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.res { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; }
.res.on { background: var(--raised); border: 1px solid var(--line); }
.res.off { opacity: .6; }
.note { font-size: 12px; color: var(--faint); }

/* Reveal: each card spins in on a stage, then settles into the grid */
.stage { min-height: 360px; display: grid; place-items: center; perspective: 1000px; cursor: pointer; }
.stage[hidden] { display: none !important; }
.spin { animation: spinIn .85s cubic-bezier(.2,.75,.2,1) both; }
.spin-gold { animation-duration: 1.5s; }
.spin-gold::after { content: ""; position: absolute; inset: -30%; background: radial-gradient(circle, rgb(242 207 99 / .55), transparent 60%); animation: burst 1.5s ease-out both; pointer-events: none; }
@keyframes spinIn { 0% { transform: translateX(140%) rotateY(-900deg) scale(.5); opacity: 0; } 35% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes burst { 0%, 60% { opacity: 0; transform: scale(.6); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
.land { animation: land .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes land { from { transform: translateY(-40px) scale(1.3); opacity: 0; } to { transform: none; opacity: 1; } }
/* Booster reel */
.reel { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--line); background: var(--sunk); padding: 14px 0; }
.reel-strip { display: flex; width: max-content; will-change: transform; }
.reel-tile { width: 108px; margin: 0 6px; height: 120px; border-radius: 14px; border: 3px solid; background: var(--panel); display: grid; place-items: center; align-content: center; gap: 4px; flex-shrink: 0; }
.reel-tile span { font-size: 36px; } .reel-tile b { font: 800 14px/1 var(--display); text-transform: uppercase; }
.reel-mark { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
.pop { animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
/* Matches: green = entered, red = not */
.match { display: flex; align-items: center; gap: 12px; padding: 16px; cursor: pointer; color: inherit; border-width: 2px; width: 100%; }
.match.in { border-color: var(--mint); } .match.out { border-color: var(--red); }
.hubs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.hub { display: grid; gap: 4px; padding: 16px; text-align: left; cursor: pointer; color: inherit; min-width: 0; }

    selSlot = k; render(); return pickerSheet(k); }
  if (d.choose) { const en = entryOf(cur); const k = d.for, id = +d.choose; for (const kk of Object.keys(en.slots)) if (en.slots[kk] === id) delete en.slots[kk]; en.bench = en.bench.map((x) => (x === id ? null : x));
    const prev = k.startsWith("B-") ? en.bench[+k.slice(2)] : en.slots[k]; if (prev && S.boosterUse?.on === prev) S.boosterUse.on = null;
    if (k.startsWith("B-")) en.bench[+k.slice(2)] = id; else en.slots[k] = id; save(); closeSheet(); selSlot = null; return render(); }
  if (d.remove) { const en = entryOf(cur); const k = d.remove; const prev = k.startsWith("B-") ? en.bench[+k.slice(2)] : en.slots[k]; if (S.boosterUse?.on === prev) S.boosterUse.on = null;
    if (k.startsWith("B-")) en.bench[+k.slice(2)] = null; else delete en.slots[k]; save(); closeSheet(); selSlot = null; return render(); }
  if (d.enter !== undefined) { const b = S.boosters.find((x) => x.gw === S.gw.n && !x.used); if (b && S.boosterUse?.match === cur && !S.boosterUse.on) return toast("Tap a player to carry your booster, or remove it");
    entryOf(cur).entered = true; save(); const name = M(cur).name; cur = null; render(); window.scrollTo(0, 0); return toast(name + " entered ✓"); }
  if (d.withdraw !== undefined) { entryOf(cur).entered = false; if (S.boosterUse?.match === cur) S.boosterUse = null; save(); return render(); }
  if (d.play !== undefined) { playGameweek(); cur = null; render(); const el = document.getElementById("results"); if (el) el.scrollIntoView({ behavior: "smooth" });
    return toast(`GW${S.gw.last.n} played${S.gw.last.won.length ? " — won " + S.gw.last.won.join(", ") : ""}. Tuesday: a new booster pack has landed`); }
  if (d.team) { const [mid, i] = d.team.split(":"); return teamSheet(mid, +i); }

  if (d.ttab) { tTab = d.ttab; return render(); }
  if (d.buyl) { const l = S.market.listings.find((x) => x.id === d.buyl); if (!l || !spend(l.price, "Bought " + PLAYERS[l.p].name)) return;
    S.market.listings = S.market.listings.filter((x) => x !== l); S.cards.push({ id: S.nextId++, p: l.p, serial: serial(PLAYERS[l.p]), acq: l.seller === "MATCHX" ? "MATCHX" : "Transfer", starter: false, pts: 0 }); save(); render(); return toast(PLAYERS[l.p].name + " signed"); }
  if (d.bid) { const a = S.market.auctions.find((x) => x.id === d.bid); const amt = a.bid + 10; if (!a.mine && !spend(amt, "Auction bid — held")) return;
    if (a.mine) { if (!spend(10, "Raised auction bid")) return; } a.bid = amt; a.mine = true; a.bidder = "You"; save(); render();
    setTimeout(() => { if (a.mine && a.botMax > a.bid && Math.random() < 0.5) { a.mine = false; a.bidder = pick(SELLERS); S.bonus += a.bid; S.ledger.push({ t: Date.now(), d: "Outbid — MX returned", a: a.bid }); a.bid += 10 * (1 + rnd(3)); save(); if (view === "transfers") render(); toast(`Outbid on ${PLAYERS[a.p].name}`); } }, 2500 + rnd(3000));
    return toast("You lead the auction"); }
  if (d.list) return sellSheet(+d.list);
  if (d.unlist) { S.market.mine = S.market.mine.filter((l) => l.cardId !== +d.unlist); save(); return render(); }
  if (d.room) { room = d.room; return render(); }
  if (d.reset !== undefined) { document.getElementById("reset").innerHTML = `<div class="row"><span class="muted">Delete your players, MX and history?</span><button class="btn btn-primary" data-reset-yes>Yes, start over</button><button class="btn btn-ghost" data-go="me">Keep playing</button></div>`; return; }

});

function cardSheet(id) {
  const c = S.cards.find((x) => x.id === id); const pl = P(c); const h = pl.hist; const v = value(pl), t = trend(pl);
  const min = Math.min(...h) - 1, max = Math.max(...h) + 1, W = 300, H = 110;

  sheet(`<div class="stack" style="gap:16px"><div class="row" style="justify-content:space-between"><p class="eyebrow">${TIER[pl.tier]} · ${pl.pos} · #${c.serial}</p><button class="btn btn-ghost" data-close style="padding:8px 14px">Close</button></div>

        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="MP value over the last ${h.length} gameweeks"><path d="M${pts.map((p) => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${H} L${pts[0][0]},${H} Z" fill="${col}" opacity=".14"/><path d="M${pts.map((p) => p.join(",")).join(" L")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="${col}"/>`).join("")}</svg>
